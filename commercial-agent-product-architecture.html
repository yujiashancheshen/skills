<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商业化智能体产品技术架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --paper: #f4f6fb;
      --ink: #2a2f45;
      --muted: #5a6275;
      --soft: #8790a3;
      --blue: #5b8def;
      --blue-tint: #eaf0fe;
      --teal: #4fc3c3;
      --teal-tint: #e8f7f7;
      --purple: #9b8cff;
      --purple-tint: #f0efff;
      --orange: #ff9e64;
      --orange-tint: #fff1e8;
      --line: #d6dcea;
      --white: #ffffff;
      --sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif SC', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 48px 56px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }
    .frame { max-width: 1600px; margin: 0 auto; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font: 500 12px/1 var(--mono);
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 10px;
      color: var(--ink);
      font: 400 36px/1.08 var(--serif);
    }
    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      font: 16px/1.5 var(--sans);
    }
    .diagram-scroll { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1200px; height: auto; }
    .note {
      margin: 16px 0 0;
      padding-top: 14px;
      border-top: 1px solid rgba(42,47,69,.14);
      color: var(--muted);
      font: 12px/1.6 var(--sans);
    }
    .note strong { color: var(--ink); font-weight: 600; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">ARCHITECTURE · COMMERCIAL AGENT PLATFORM</p>
    <h1>商业化智能体产品技术架构</h1>
    <p class="subtitle">把用户目标转成可确认、可执行、可回滚、可计量的交付结果</p>

    <div class="diagram-scroll">

        <marker id="commercial-arrow-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">

    </div>

    <p class="note"><strong>阅读重点：</strong>编排器负责把目标变成受控计划；工具网关只暴露可评估的结果型能力；工作区负责稳定执行和产物版本；安全与计量从旁路接入每次工具调用、资源消耗和外部发布。</p>
  </main>
</body>
</html>
