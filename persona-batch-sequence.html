<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户画像批处理链路</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --rule: rgba(45,49,66,0.12);
      --accent: #eb6c36;
      --accent-tint: rgba(235,108,54,0.08);
      --link: #2e5aa8;
      --sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif;
      --mono: 'Geist Mono', 'Noto Sans Mono CJK SC', monospace;
    }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }
    main { width: min(100%, 1360px); margin: 0 auto; padding: 48px 40px 64px; }
    header { margin-bottom: 40px; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 12px;
      font-family: var(--serif);
      font-size: 40px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.15;
    }
    .subtitle { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.6; }
    section { padding: 32px 0 40px; border-top: 1px solid var(--rule); }
    section:first-of-type { border-top: 0; padding-top: 0; }
    .section-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
    .phase {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.16em;
    }
    h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0; }
    .svg-wrap { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1120px; height: auto; }
    footer {
      border-top: 1px solid var(--rule);
      padding-top: 20px;
      color: var(--soft);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Sequence · Persona Pipeline</p>
      <h1>用户画像批处理链路</h1>
      <p class="subtitle">从 T 日增量事件导入，到载荷入队、LLM 生成画像快照，以及失败重试和迟到数据回补。</p>
    </header>

    <section>
      <div class="section-head"><span class="phase">PHASE 01</span><h2>离线导入与语料准备</h2></div>
      <div class="svg-wrap">
        <svg viewBox="0 0 1280 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="persona-ingest-title persona-ingest-desc">
          <title id="persona-ingest-title">离线导入与语料准备</title>
          <desc id="persona-ingest-desc">调度平台触发 UDA 导出并启动 personaIngest，导入程序下载、过滤和去重事件，随后写入 MySQL、上传 COS 并标记语料状态。</desc>
          <defs>
            <marker id="ingest-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
            <marker id="ingest-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
            <marker id="ingest-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
          </defs>
          <rect width="1280" height="680" fill="#f5f5f5"/>

          <g stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3">
            <line x1="128" y1="112" x2="128" y2="600"/><line x1="384" y1="112" x2="384" y2="600"/>
            <line x1="640" y1="112" x2="640" y2="600"/><line x1="896" y1="112" x2="896" y2="600"/>
            <line x1="1152" y1="112" x2="1152" y2="600"/>
          </g>
          <rect x="636" y="212" width="8" height="336" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

          <g fill="none" stroke-width="1.2">
            <line x1="128" y1="156" x2="384" y2="156" stroke="#2e5aa8" marker-end="url(#ingest-link)"/>
            <line x1="128" y1="212" x2="640" y2="212" stroke="#eb6c36" marker-end="url(#ingest-accent)"/>
            <line x1="640" y1="268" x2="384" y2="268" stroke="#2e5aa8" marker-end="url(#ingest-link)"/>
            <path d="M 644 324 H 700 Q 708 324 708 332 V 356 Q 708 364 700 364 H 644" stroke="#4f5d75" marker-end="url(#ingest-arrow)"/>
            <line x1="640" y1="420" x2="896" y2="420" stroke="#4f5d75" marker-end="url(#ingest-arrow)"/>
            <line x1="640" y1="476" x2="1152" y2="476" stroke="#4f5d75" stroke-dasharray="5,4" marker-end="url(#ingest-arrow)"/>
            <line x1="640" y1="532" x2="896" y2="532" stroke="#eb6c36" marker-end="url(#ingest-accent)"/>
          </g>

          <g font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" font-size="12" text-anchor="middle">
            <g fill="#2e5aa8"><rect x="188" y="132" width="136" height="16" rx="2" fill="#f5f5f5"/><text x="256" y="144">1 · 触发 T 日增量导出</text></g>
            <g fill="#eb6c36"><rect x="288" y="188" width="192" height="16" rx="2" fill="#f5f5f5"/><text x="384" y="200">2 · date=T 启动一次导入</text></g>
            <g fill="#2e5aa8"><rect x="448" y="244" width="128" height="16" rx="2" fill="#f5f5f5"/><text x="512" y="256">3 · 下载增量事件 CSV</text></g>
            <g fill="#4f5d75" text-anchor="start"><rect x="724" y="328" width="236" height="36" rx="2" fill="#f5f5f5"/><text x="732" y="340">4 · 过滤来源与 90 天窗口</text><text x="732" y="356">按 uid 分组去重</text></g>
            <g fill="#4f5d75"><rect x="704" y="396" width="128" height="16" rx="2" fill="#f5f5f5"/><text x="768" y="408">5 · 创建批次与 UID 明细</text></g>
            <g fill="#4f5d75"><rect x="824" y="452" width="144" height="16" rx="2" fill="#f5f5f5"/><text x="896" y="464">6 · 上传每 UID 事件载荷</text></g>
            <g fill="#eb6c36"><rect x="700" y="508" width="136" height="16" rx="2" fill="#f5f5f5"/><text x="768" y="520">7 · 写入语料就绪状态</text></g>
          </g>
          <g font-family="'Geist','Noto Sans SC',sans-serif" font-size="12" fill="#4f5d75">
            <text x="640" y="572" text-anchor="middle">足够：SyncSuccess　·　不足：AISkipped</text>
          </g>

          <g font-family="'Geist','Noto Sans SC',sans-serif" fill="#2d3142" text-anchor="middle">
            <g><rect x="48" y="48" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399"/><text x="128" y="76" font-size="12" font-weight="600">调度平台</text><text x="128" y="96" fill="#4f5d75" font-size="12">Scheduler</text></g>
            <g><rect x="304" y="48" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/><text x="384" y="76" font-size="12" font-weight="600">离线数仓 / UDA</text><text x="384" y="96" fill="#4f5d75" font-size="12">增量事件 CSV</text></g>
            <g><rect x="552" y="48" width="176" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/><text x="640" y="76" font-size="12" font-weight="600">xxcrm personaIngest</text><text x="640" y="96" fill="#4f5d75" font-size="12">导入与清洗</text></g>
            <g><rect x="808" y="48" width="176" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/><text x="896" y="76" font-size="12" font-weight="600">MySQL</text><text x="896" y="96" fill="#4f5d75" font-size="12">tblPersonaBatch / Item</text></g>
            <g><rect x="1072" y="48" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/><text x="1152" y="76" font-size="12" font-weight="600">私有 COS</text><text x="1152" y="96" fill="#4f5d75" font-size="12">UID 事件载荷</text></g>
          </g>
          <line x1="48" y1="616" x2="1232" y2="616" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
          <text x="48" y="640" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">STATUS</text>
          <text x="120" y="640" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif">批次和明细完成持久化，事件载荷已进入私有对象存储</text>
        </svg>
      </div>
    </section>

    <section>
      <div class="section-head"><span class="phase">PHASE 02</span><h2>批次入队与生成窗口</h2></div>
      <div class="svg-wrap">
        <svg viewBox="0 0 1280 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="persona-queue-title persona-queue-desc">
          <title id="persona-queue-title">批次入队与生成窗口</title>
          <desc id="persona-queue-desc">personaIngest 将批次放入 Redis，调度平台启动 personaLLM 生成窗口，personaLLM 随后从队列获取批次；迟到数据在次日重新纳入。</desc>
          <defs><marker id="queue-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="queue-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker><marker id="queue-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker></defs>
          <rect width="1280" height="424" fill="#f5f5f5"/>
          <g stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"><line x1="160" y1="112" x2="160" y2="352"/><line x1="480" y1="112" x2="480" y2="352"/><line x1="800" y1="112" x2="800" y2="352"/><line x1="1120" y1="112" x2="1120" y2="352"/></g>
          <g fill="none" stroke-width="1.2"><line x1="160" y1="164" x2="480" y2="164" stroke="#4f5d75" stroke-dasharray="5,4" marker-end="url(#queue-open)"/><line x1="800" y1="220" x2="1120" y2="220" stroke="#eb6c36" marker-end="url(#queue-accent)"/><line x1="1120" y1="276" x2="480" y2="276" stroke="#4f5d75" marker-end="url(#queue-arrow)"/></g>
          <rect x="128" y="316" width="704" height="48" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)"/><rect x="128" y="316" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)"/><text x="148" y="328" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text><text x="180" y="328" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace">[数据源迟到]</text><line x1="800" y1="348" x2="160" y2="348" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#queue-open)"/>
          <g font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" font-size="12" text-anchor="middle"><g fill="#4f5d75"><rect x="248" y="140" width="144" height="16" rx="2" fill="#f5f5f5"/><text x="320" y="152">8 · 批次进入待处理队列</text></g><g fill="#eb6c36"><rect x="880" y="196" width="160" height="16" rx="2" fill="#f5f5f5"/><text x="960" y="208">9 · 启动画像生成任务窗口</text></g><g fill="#4f5d75"><rect x="724" y="252" width="152" height="16" rx="2" fill="#f5f5f5"/><text x="800" y="264">10 · 获取一个待处理批次</text></g><g fill="#4f5d75"><rect x="396" y="324" width="168" height="16" rx="2" fill="#f5f5f5"/><text x="480" y="336">16 · 次日重新纳入该 UID</text></g></g>
          <g font-family="'Geist','Noto Sans SC',sans-serif" fill="#2d3142" text-anchor="middle"><g><rect x="72" y="48" width="176" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/><text x="160" y="76" font-size="12" font-weight="600">xxcrm personaIngest</text><text x="160" y="96" fill="#4f5d75" font-size="12">批次生产者</text></g><g><rect x="392" y="48" width="176" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/><text x="480" y="76" font-size="12" font-weight="600">Redis</text><text x="480" y="96" fill="#4f5d75" font-size="12">persona:ai:pending</text></g><g><rect x="720" y="48" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399"/><text x="800" y="76" font-size="12" font-weight="600">调度平台</text><text x="800" y="96" fill="#4f5d75" font-size="12">任务窗口</text></g><g><rect x="1032" y="48" width="176" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/><text x="1120" y="76" font-size="12" font-weight="600">xxcrm personaLLM</text><text x="1120" y="96" fill="#4f5d75" font-size="12">批次消费者</text></g></g>
          <line x1="72" y1="380" x2="1208" y2="380" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="72" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">HANDOFF</text><text x="160" y="404" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif">Redis 解耦导入与生成；迟到数据回到下一业务日导入周期</text>
        </svg>
      </div>
    </section>

    <section>
      <div class="section-head"><span class="phase">PHASE 03</span><h2>LLM 画像生成与结果落库</h2></div>
      <div class="svg-wrap">
        <svg viewBox="0 0 1280 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="persona-llm-title persona-llm-desc">
          <title id="persona-llm-title">LLM 画像生成与结果落库</title>
          <desc id="persona-llm-desc">personaLLM 从 COS 读取载荷，请求模型生成画像 JSON，在 MySQL 事务中写入带版本的快照并更新成功状态；失败且未超过重试次数时记录失败并增加计数。</desc>
          <defs><marker id="llm-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="llm-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><marker id="llm-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker></defs>
          <rect width="1280" height="600" fill="#f5f5f5"/>
          <g stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"><line x1="160" y1="112" x2="160" y2="528"/><line x1="480" y1="112" x2="480" y2="528"/><line x1="800" y1="112" x2="800" y2="528"/><line x1="1120" y1="112" x2="1120" y2="528"/></g>
          <rect x="156" y="156" width="8" height="320" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
          <g fill="none" stroke-width="1.2"><line x1="160" y1="164" x2="480" y2="164" stroke="#4f5d75" marker-end="url(#llm-arrow)"/><line x1="160" y1="220" x2="800" y2="220" stroke="#2e5aa8" marker-end="url(#llm-link)"/><line x1="800" y1="276" x2="160" y2="276" stroke="#4f5d75" stroke-dasharray="5,4" marker-end="url(#llm-arrow)"/><line x1="160" y1="348" x2="1120" y2="348" stroke="#eb6c36" marker-end="url(#llm-accent)"/></g>
          <rect x="128" y="388" width="1024" height="112" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)"/><rect x="128" y="388" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)"/><text x="148" y="400" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text><text x="180" y="400" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace">[明细失败且未超过重试次数]</text><line x1="160" y1="444" x2="1120" y2="444" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#llm-arrow)"/>
          <g font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" font-size="12" text-anchor="middle"><g fill="#4f5d75"><rect x="248" y="140" width="144" height="16" rx="2" fill="#f5f5f5"/><text x="320" y="152">11 · 读取 UID 事件载荷</text></g><g fill="#2e5aa8"><rect x="388" y="196" width="184" height="16" rx="2" fill="#f5f5f5"/><text x="480" y="208">12 · 请求生成结构化画像 JSON</text></g><g fill="#4f5d75"><rect x="388" y="252" width="184" height="16" rx="2" fill="#f5f5f5"/><text x="480" y="264">13 · 返回结构化画像结果</text></g><g fill="#eb6c36"><rect x="536" y="324" width="208" height="16" rx="2" fill="#f5f5f5"/><text x="640" y="336">14 · 同事务写快照并标 AISuccess</text></g><g fill="#4f5d75"><rect x="520" y="420" width="240" height="16" rx="2" fill="#f5f5f5"/><text x="640" y="432">15 · 标 AIFail 并累加 retry_count</text></g></g>
          <text x="640" y="372" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">快照包含 schema_version</text>
          <g font-family="'Geist','Noto Sans SC',sans-serif" fill="#2d3142" text-anchor="middle"><g><rect x="72" y="48" width="176" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/><text x="160" y="76" font-size="12" font-weight="600">xxcrm personaLLM</text><text x="160" y="96" fill="#4f5d75" font-size="12">画像生成任务</text></g><g><rect x="400" y="48" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/><text x="480" y="76" font-size="12" font-weight="600">私有 COS</text><text x="480" y="96" fill="#4f5d75" font-size="12">事件载荷</text></g><g><rect x="720" y="48" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/><text x="800" y="76" font-size="12" font-weight="600">LLM 服务</text><text x="800" y="96" fill="#4f5d75" font-size="12">画像 JSON</text></g><g><rect x="1032" y="48" width="176" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/><text x="1120" y="76" font-size="12" font-weight="600">MySQL</text><text x="1120" y="96" fill="#4f5d75" font-size="12">快照与明细状态</text></g></g>
          <line x1="72" y1="544" x2="1208" y2="544" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="72" y="568" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">RESULT</text><text x="144" y="568" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif">成功写入版本化快照；可重试失败保留状态与次数</text>
        </svg>
      </div>
    </section>
    <footer>DIAGRAM DESIGN · DEFAULT PROFILE · DOC-WIDE · STATIC HTML</footer>
  </main>
</body>
</html>
