<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画像详情与反馈用户旅程</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@500&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --paper: #f6f8fb;
      --ink: #172033;
      --muted: #5b6577;
      --soft: #8791a2;
      --rule: #d9dee7;
      --blue: #2563a6;
      --blue-tint: #edf4fb;
      --accent: #d97732;
      --accent-tint: #fff6ed;
      --sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif;
      --mono: 'Geist Mono', 'Noto Sans Mono CJK SC', monospace;
    }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    main { width: min(100%, 1400px); margin: 0 auto; padding: 36px 40px 44px; }
    .header { display: flex; align-items: end; justify-content: space-between; gap: 32px; margin-bottom: 20px; }
    .eyebrow { margin: 0 0 6px; color: var(--blue); font-family: var(--mono); font-size: 8px; letter-spacing: 0.14em; }
    h1 { margin: 0; font-family: var(--serif); font-size: 36px; font-weight: 400; line-height: 1.1; }
    .context { max-width: 520px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; text-align: right; }
    .context strong { color: var(--ink); font-weight: 600; }
    .canvas { overflow-x: auto; background: #fff; border: 1px solid var(--rule); border-radius: 8px; }
    svg { display: block; width: 100%; min-width: 1160px; height: auto; }
    footer { margin-top: 12px; color: var(--soft); font-family: var(--mono); font-size: 8px; letter-spacing: 0.08em; }
  </style>
</head>
<body>
  <main>
    <header class="header">
      <div>
        <p class="eyebrow">USER JOURNEY · PERSONA DETAIL</p>
        <h1>画像详情与反馈用户旅程</h1>
      </div>
      <p class="context"><strong>用户角色：顾问</strong><br>从打开线索或商机详情，到查看画像依据并提交准确性反馈。</p>
    </header>

    <div class="canvas">
      <svg viewBox="0 0 1320 744" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="persona-journey-title persona-journey-desc">
        <title id="persona-journey-title">画像详情与反馈用户旅程</title>
        <desc id="persona-journey-desc">顾问在商机详情中加载、查看和验证客户画像，并在发现不准确时提交反馈的五阶段用户旅程；画像资格判定与加载是体验低谷。</desc>
        <defs>
          <marker id="journey-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0,8 3,0 6" fill="#8791a2"/>
          </marker>
          <marker id="journey-arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0,8 3,0 6" fill="#2563a6"/>
          </marker>
          <marker id="journey-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0,8 3,0 6" fill="#d97732"/>
          </marker>
        </defs>
        <rect width="1320" height="744" fill="#fff"/>

        <!-- Stage headers -->
        <g font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">
          <g><rect x="144" y="32" width="200" height="88" rx="6" fill="#edf4fb" stroke="#c8d8e8"/><text x="244" y="56" fill="#2563a6" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".12em">STAGE 1</text><text x="244" y="84" fill="#172033" font-size="16" font-weight="600">进入详情</text><text x="244" y="104" fill="#5b6577" font-size="12">明确查看对象</text></g>
          <g><rect x="368" y="32" width="200" height="88" rx="6" fill="#fff" stroke="#d9dee7"/><text x="468" y="56" fill="#8791a2" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".12em">STAGE 2</text><text x="468" y="84" fill="#172033" font-size="16" font-weight="600">加载与判定</text><text x="468" y="104" fill="#5b6577" font-size="12">校验资格并读取快照</text></g>
          <g><rect x="592" y="32" width="200" height="88" rx="6" fill="#edf4fb" stroke="#c8d8e8"/><text x="692" y="56" fill="#2563a6" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".12em">STAGE 3</text><text x="692" y="84" fill="#172033" font-size="16" font-weight="600">浏览画像</text><text x="692" y="104" fill="#5b6577" font-size="12">快速识别客户特征</text></g>
          <g><rect x="816" y="32" width="200" height="88" rx="6" fill="#fff" stroke="#d9dee7"/><text x="916" y="56" fill="#8791a2" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".12em">STAGE 4</text><text x="916" y="84" fill="#172033" font-size="16" font-weight="600">查看依据</text><text x="916" y="104" fill="#5b6577" font-size="12">理解标签形成原因</text></g>
          <g><rect x="1040" y="32" width="200" height="88" rx="6" fill="#edf4fb" stroke="#c8d8e8"/><text x="1140" y="56" fill="#2563a6" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".12em">STAGE 5</text><text x="1140" y="84" fill="#172033" font-size="16" font-weight="600">提交反馈</text><text x="1140" y="104" fill="#5b6577" font-size="12">闭环画像准确性问题</text></g>
        </g>

        <!-- Sentiment band -->
        <g font-family="'Geist Mono',monospace" font-size="8" fill="#8791a2" text-anchor="end" letter-spacing=".08em">
          <text x="120" y="164">HIGH</text><text x="120" y="236">NEUTRAL</text><text x="120" y="308">LOW</text>
        </g>
        <g stroke="#d9dee7" stroke-width="1">
          <line x1="144" y1="160" x2="1240" y2="160"/><line x1="144" y1="232" x2="1240" y2="232"/><line x1="144" y1="304" x2="1240" y2="304"/>
        </g>
        <text x="120" y="140" fill="#5b6577" font-size="8" font-family="'Geist Mono',monospace" text-anchor="end" letter-spacing=".08em">SENTIMENT</text>

        <!-- Data curve: the eligibility/loading stage is the trough -->
        <path d="M244 196 C320 196 392 268 468 268" fill="none" stroke="#d97732" stroke-width="2"/>
        <path d="M468 268 C544 268 616 160 692 160 S840 196 916 196 S1064 168 1140 168" fill="none" stroke="#5b6577" stroke-width="1.5"/>
        <g fill="#fff" stroke="#5b6577" stroke-width="2"><circle cx="244" cy="196" r="5"/><circle cx="692" cy="160" r="5"/><circle cx="916" cy="196" r="5"/><circle cx="1140" cy="168" r="5"/></g>
        <circle cx="468" cy="268" r="6" fill="#d97732" stroke="#fff" stroke-width="2"/>
        <text x="244" y="184" fill="#5b6577" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">MED-HIGH</text>
        <text x="468" y="288" fill="#d97732" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">MED-LOW</text>
        <text x="692" y="148" fill="#5b6577" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">HIGH</text>
        <text x="916" y="184" fill="#5b6577" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">MED-HIGH</text>
        <text x="1140" y="156" fill="#5b6577" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">HIGH</text>

        <!-- Actions -->
        <line x1="120" y1="336" x2="1240" y2="336" stroke="#d9dee7"/>
        <text x="120" y="368" fill="#5b6577" font-size="8" font-family="'Geist Mono',monospace" text-anchor="end" letter-spacing=".08em">ACTIONS</text>
        <g fill="#172033" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">
          <text x="244" y="372"><tspan x="244">打开线索 / 商机</tspan><tspan x="244" dy="20">详情页</tspan></text>
          <text x="468" y="372"><tspan x="468">等待画像加载</tspan><tspan x="468" dy="20">与展示判定</tspan></text>
          <text x="692" y="372"><tspan x="692">阅读头像角标</tspan><tspan x="692" dy="20">与画像卡片</tspan></text>
          <text x="916" y="372"><tspan x="916">进入跟进页签</tspan><tspan x="916" dy="20">查看标签依据</tspan></text>
          <text x="1140" y="372"><tspan x="1140">点击“反馈不准”</tspan><tspan x="1140" dy="20">并提交</tspan></text>
        </g>
        <rect x="368" y="420" width="200" height="36" rx="2" fill="#fff6ed" stroke="rgba(217,119,50,.65)" stroke-dasharray="3,3"/>
        <text x="468" y="436" fill="#b65d22" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle"><tspan x="468">未命中灰度或无成功快照</tspan><tspan x="468" dy="12">整卡与角标不展示</tspan></text>

        <!-- Touchpoints -->
        <line x1="120" y1="476" x2="1240" y2="476" stroke="#d9dee7"/>
        <text x="120" y="516" fill="#5b6577" font-size="8" font-family="'Geist Mono',monospace" text-anchor="end" letter-spacing=".08em">TOUCHPOINTS</text>
        <g fill="#5b6577" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">
          <text x="244" y="516">线索 / 商机详情</text><text x="468" y="516">CRM 子应用</text><text x="692" y="516">画像卡片</text><text x="916" y="516">跟进页签 / 标签证据</text><text x="1140" y="516">反馈入口</text>
        </g>

        <!-- System response -->
        <line x1="120" y1="552" x2="1240" y2="552" stroke="#d9dee7"/>
        <text x="120" y="588" fill="#5b6577" font-size="8" font-family="'Geist Mono',monospace" text-anchor="end" letter-spacing=".08em">SYSTEM</text>
        <g fill="#5b6577" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">
          <text x="244" y="584"><tspan x="244">加载 CRM 子应用</tspan><tspan x="244" dy="20">注入用户上下文</tspan></text>
          <text x="468" y="584"><tspan x="468">校验资源归属与学校</tspan><tspan x="468" dy="20">读取最新成功快照</tspan></text>
          <text x="692" y="584"><tspan x="692">按 schema_version 适配</tspan><tspan x="692" dy="20">批量换顾问中文姓名</tspan></text>
          <text x="916" y="584"><tspan x="916">展示标签或该维度证据</tspan><tspan x="916" dy="20">上报 JTU_001 曝光</tspan></text>
          <text x="1140" y="584"><tspan x="1140">校验当前跟进顾问</tspan><tspan x="1140" dy="20">写入反馈并返回成功</tspan></text>
        </g>

        <!-- Legend -->
        <line x1="40" y1="668" x2="1280" y2="668" stroke="#d9dee7"/>
        <text x="40" y="700" fill="#8791a2" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".12em">LEGEND</text>
        <line x1="144" y1="696" x2="184" y2="696" stroke="#5b6577" stroke-width="1.5"/><circle cx="164" cy="696" r="5" fill="#fff" stroke="#5b6577" stroke-width="2"/><text x="200" y="700" fill="#5b6577" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif">顾问体验走势</text>
        <line x1="376" y1="696" x2="416" y2="696" stroke="#d97732" stroke-width="2"/><circle cx="396" cy="696" r="6" fill="#d97732" stroke="#fff" stroke-width="2"/><text x="432" y="700" fill="#5b6577" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif">旅程低谷</text>
        <rect x="560" y="684" width="40" height="24" rx="2" fill="#fff6ed" stroke="rgba(217,119,50,.65)" stroke-dasharray="3,3"/><text x="616" y="700" fill="#5b6577" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif">体验风险</text>
      </svg>
    </div>
    <footer>SOURCE · 详情页展示画像与提交反馈时序图 · BALANCED · MIXED AUDIENCE</footer>
  </main>
</body>
</html>
