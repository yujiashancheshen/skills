<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家长报名线下课程用户旅程</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@500&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --paper: #f6f8fb;
      --ink: #172033;
      --muted: #5b6577;
      --soft: #8791a2;
      --rule: #d9dee7;
      --blue: #2563a6;
      --accent: #d97732;
      --green: #387a61;
      --sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif;
      --mono: 'Geist Mono', 'Noto Sans Mono CJK SC', monospace;
    }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    main { width: min(100%, 1400px); margin: 0 auto; padding: 36px 40px 44px; }
    .header { display: flex; align-items: end; justify-content: space-between; gap: 32px; margin-bottom: 20px; }
    .eyebrow { margin: 0 0 6px; color: var(--blue); font-family: var(--mono); font-size: 8px; letter-spacing: 0.14em; }
    h1 { margin: 0; font-family: var(--serif); font-size: 36px; font-weight: 400; line-height: 1.1; }
    .persona { max-width: 520px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; text-align: right; }
    .persona strong { color: var(--ink); font-weight: 600; }
    .canvas { overflow-x: auto; background: #fff; border: 1px solid var(--rule); border-radius: 8px; }
    svg { display: block; width: 100%; min-width: 1160px; height: auto; }
    footer { margin-top: 12px; color: var(--soft); font-family: var(--mono); font-size: 8px; letter-spacing: 0.08em; }
  </style>
</head>
<body>
  <main>
    <header class="header">
      <div>
        <p class="eyebrow">USER JOURNEY · ENROLLMENT EXPERIENCE</p>
        <h1>家长报名线下课程用户旅程</h1>
      </div>
      <p class="persona"><strong>用户角色：重视效果、时间有限的家长</strong><br>目标是在可信、透明且省心的前提下，为孩子选择合适的课程。</p>
    </header>

    <div class="canvas">
      <svg viewBox="0 0 1320 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="typical-journey-title typical-journey-desc">
        <title id="typical-journey-title">家长报名线下课程用户旅程</title>
        <desc id="typical-journey-desc">家长从发现课程、了解比较、预约试听、参加试听到报名缴费的五阶段旅程，展示每个阶段的行为、接触点、情绪变化、痛点与改善机会。</desc>
        <rect width="1320" height="780" fill="#fff"/>

        <!-- Stage headers -->
        <g font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">
          <g><rect x="144" y="32" width="200" height="88" rx="6" fill="#edf4fb" stroke="#c8d8e8"/><text x="244" y="56" fill="#2563a6" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".12em">STAGE 1</text><text x="244" y="84" fill="#172033" font-size="16" font-weight="600">发现课程</text><text x="244" y="104" fill="#5b6577" font-size="12">产生兴趣与初步认知</text></g>
          <g><rect x="368" y="32" width="200" height="88" rx="6" fill="#fff" stroke="#d9dee7"/><text x="468" y="56" fill="#8791a2" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".12em">STAGE 2</text><text x="468" y="84" fill="#172033" font-size="16" font-weight="600">了解与比较</text><text x="468" y="104" fill="#5b6577" font-size="12">判断是否值得进一步接触</text></g>
          <g><rect x="592" y="32" width="200" height="88" rx="6" fill="#edf4fb" stroke="#c8d8e8"/><text x="692" y="56" fill="#2563a6" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".12em">STAGE 3</text><text x="692" y="84" fill="#172033" font-size="16" font-weight="600">预约试听</text><text x="692" y="104" fill="#5b6577" font-size="12">选择门店与合适时间</text></g>
          <g><rect x="816" y="32" width="200" height="88" rx="6" fill="#edf7f2" stroke="#c9dfd5"/><text x="916" y="56" fill="#387a61" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".12em">STAGE 4</text><text x="916" y="84" fill="#172033" font-size="16" font-weight="600">参加试听</text><text x="916" y="104" fill="#5b6577" font-size="12">验证教学与孩子感受</text></g>
          <g><rect x="1040" y="32" width="200" height="88" rx="6" fill="#edf7f2" stroke="#c9dfd5"/><text x="1140" y="56" fill="#387a61" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".12em">STAGE 5</text><text x="1140" y="84" fill="#172033" font-size="16" font-weight="600">报名缴费</text><text x="1140" y="104" fill="#5b6577" font-size="12">完成决策并确认权益</text></g>
        </g>

        <!-- Sentiment curve -->
        <text x="120" y="140" fill="#5b6577" font-size="8" font-family="'Geist Mono',monospace" text-anchor="end" letter-spacing=".08em">SENTIMENT</text>
        <g font-family="'Geist Mono',monospace" font-size="8" fill="#8791a2" text-anchor="end" letter-spacing=".08em">
          <text x="120" y="164">HIGH</text><text x="120" y="236">NEUTRAL</text><text x="120" y="308">LOW</text>
        </g>
        <g stroke="#d9dee7" stroke-width="1">
          <line x1="144" y1="160" x2="1240" y2="160"/><line x1="144" y1="232" x2="1240" y2="232"/><line x1="144" y1="304" x2="1240" y2="304"/>
        </g>
        <path d="M244 232 C320 232 392 304 468 304" fill="none" stroke="#d97732" stroke-width="2"/>
        <path d="M468 304 C544 304 616 232 692 232 S840 160 916 160 S1064 188 1140 188" fill="none" stroke="#5b6577" stroke-width="1.5"/>
        <g fill="#fff" stroke="#5b6577" stroke-width="2"><circle cx="244" cy="232" r="5"/><circle cx="692" cy="232" r="5"/><circle cx="916" cy="160" r="5"/><circle cx="1140" cy="188" r="5"/></g>
        <circle cx="468" cy="304" r="6" fill="#d97732" stroke="#fff" stroke-width="2"/>
        <g font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">
          <text x="244" y="220" fill="#5b6577">NEUTRAL</text><text x="468" y="324" fill="#d97732">LOW</text><text x="692" y="220" fill="#5b6577">NEUTRAL</text><text x="916" y="148" fill="#5b6577">HIGH</text><text x="1140" y="176" fill="#5b6577">MED-HIGH</text>
        </g>

        <!-- Actions -->
        <line x1="120" y1="348" x2="1240" y2="348" stroke="#d9dee7"/>
        <text x="120" y="380" fill="#5b6577" font-size="8" font-family="'Geist Mono',monospace" text-anchor="end" letter-spacing=".08em">ACTIONS</text>
        <g fill="#172033" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">
          <text x="244" y="384"><tspan x="244">看到朋友推荐</tspan><tspan x="244" dy="20">或课程广告</tspan></text>
          <text x="468" y="384"><tspan x="468">比较课程、师资</tspan><tspan x="468" dy="20">价格与评价</tspan></text>
          <text x="692" y="384"><tspan x="692">提交信息并选择</tspan><tspan x="692" dy="20">门店和时间</tspan></text>
          <text x="916" y="384"><tspan x="916">陪同孩子试听</tspan><tspan x="916" dy="20">观察课堂表现</tspan></text>
          <text x="1140" y="384"><tspan x="1140">选择课程方案</tspan><tspan x="1140" dy="20">确认合同并支付</tspan></text>
        </g>
        <rect x="368" y="432" width="200" height="36" rx="2" fill="#fff6ed" stroke="rgba(217,119,50,.65)" stroke-dasharray="3,3"/>
        <text x="468" y="448" fill="#b65d22" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle"><tspan x="468">信息分散，价格与规则不透明</tspan><tspan x="468" dy="12">难以快速判断差异</tspan></text>

        <!-- Touchpoints -->
        <line x1="120" y1="488" x2="1240" y2="488" stroke="#d9dee7"/>
        <text x="120" y="528" fill="#5b6577" font-size="8" font-family="'Geist Mono',monospace" text-anchor="end" letter-spacing=".08em">TOUCHPOINTS</text>
        <g fill="#5b6577" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">
          <text x="244" y="528">朋友圈 / 公众号 / 广告</text><text x="468" y="528">官网 / 小程序 / 顾问</text><text x="692" y="528">预约表单 / 电话</text><text x="916" y="528">门店 / 教室 / 教师</text><text x="1140" y="528">合同 / 收银台 / 支付</text>
        </g>

        <!-- Opportunities -->
        <line x1="120" y1="568" x2="1240" y2="568" stroke="#d9dee7"/>
        <text x="120" y="604" fill="#5b6577" font-size="8" font-family="'Geist Mono',monospace" text-anchor="end" letter-spacing=".08em">OPPORTUNITY</text>
        <g fill="#387a61" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">
          <text x="244" y="604"><tspan x="244">用真实案例建立</tspan><tspan x="244" dy="20">第一印象</tspan></text>
          <text x="468" y="604"><tspan x="468">统一展示价格、师资</tspan><tspan x="468" dy="20">和退转规则</tspan></text>
          <text x="692" y="604"><tspan x="692">减少表单字段</tspan><tspan x="692" dy="20">即时确认预约</tspan></text>
          <text x="916" y="604"><tspan x="916">提供个性化课堂反馈</tspan><tspan x="916" dy="20">明确下一步建议</tspan></text>
          <text x="1140" y="604"><tspan x="1140">费用权益一次确认</tspan><tspan x="1140" dy="20">降低决策压力</tspan></text>
        </g>

        <!-- Legend -->
        <line x1="40" y1="692" x2="1280" y2="692" stroke="#d9dee7"/>
        <text x="40" y="724" fill="#8791a2" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".12em">LEGEND</text>
        <line x1="144" y1="720" x2="184" y2="720" stroke="#5b6577" stroke-width="1.5"/><circle cx="164" cy="720" r="5" fill="#fff" stroke="#5b6577" stroke-width="2"/><text x="200" y="724" fill="#5b6577" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif">用户情绪走势</text>
        <line x1="376" y1="720" x2="416" y2="720" stroke="#d97732" stroke-width="2"/><circle cx="396" cy="720" r="6" fill="#d97732" stroke="#fff" stroke-width="2"/><text x="432" y="724" fill="#5b6577" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif">关键体验低谷</text>
        <rect x="580" y="708" width="40" height="24" rx="2" fill="#fff6ed" stroke="rgba(217,119,50,.65)" stroke-dasharray="3,3"/><text x="636" y="724" fill="#5b6577" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif">用户痛点</text>
        <rect x="756" y="708" width="40" height="24" rx="2" fill="#edf7f2" stroke="#9fc7b5"/><text x="812" y="724" fill="#5b6577" font-size="12" font-family="'Geist','Noto Sans SC',sans-serif">改善机会</text>
      </svg>
    </div>
    <footer>TYPICAL USER JOURNEY · ONE PERSONA · FIVE STAGES · THREE CONTENT ROWS</footer>
  </main>
</body>
</html>
